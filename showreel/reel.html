<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>órbita · showreel</title>
<meta name="description" content="Showreel de 15 segundos da vitrine órbita — renderizado quadro a quadro a partir deste mesmo arquivo." />
<style>
  html,body{margin:0;height:100%;background:#07090E;overflow:hidden}
  #c{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;display:block;cursor:pointer}
  #gate{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;
    background:rgba(7,9,14,.55);color:#F3F5F9;cursor:pointer;
    font:500 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;
    transition:opacity .4s}
  #gate.off{opacity:0;pointer-events:none}
  #gate b{display:grid;place-items:center;width:64px;height:64px;border:1px solid #2B323F;font-size:18px;color:#35C285}
  #gate span{color:#98A1B1}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" aria-label="órbita — showreel"></canvas>
<!-- limiar do bloom: só o que é claro de verdade brilha -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="thr" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.3" intercept="-1.3"/>
      <feFuncG type="linear" slope="2.3" intercept="-1.3"/>
      <feFuncB type="linear" slope="2.3" intercept="-1.3"/>
    </feComponentTransfer>
  </filter>
</svg>
<audio id="au" src="soundtrack.mp3" preload="auto"></audio>
<div id="gate"><b>▶</b><span>Reproduzir · espaço pausa · ← → quadro a quadro</span></div>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/scene-open.js"></script>
<script src="js/scene-system.js"></script>
<script src="js/scene-data.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
